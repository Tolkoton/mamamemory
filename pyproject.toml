[project]
name = "mamamemory"
version = "0.1.0"
description = "Мамин помічник: планування, справи, пам'ять"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.34.0",
    "itsdangerous>=2.2.0",
    "requests>=2.34.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mamamemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mamamemory"]
ignore_missing_imports = true
# gate-allow: initial project settings; google-auth ships no annotations, its calls are untyped
untyped_calls_exclude = ["google"]
